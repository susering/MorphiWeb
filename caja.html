<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja · La Esquina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecera" id="cabecera"></header>

  <main class="contenido">
    <section>
      <div class="encabezado">
        <div>
          <p class="sobre">Facturación</p>
          <h1>Cuentas del salón.</h1>
          <p class="sub">Seleccioná una mesa ocupada para ver su cuenta y cobrarla.</p>
        </div>
        <div class="contadores">
          <div class="contador rojo"><b id="n-ocupadas">0</b>Cuentas abiertas</div>
          <div class="contador verde"><b id="n-libres">0</b>Mesas libres</div>
        </div>
      </div>

      <div class="tarjeta">
        <div class="fila salon-cab">
          <div><h3>Salón principal</h3><small id="n-mesas"></small></div>
          <div class="leyenda">
            <span class="libre"><i class="punto"></i>Libre</span>
            <span class="ocupada"><i class="punto"></i>Ocupada</span>
          </div>
        </div>
        <div class="mesas" id="mapa"></div>
        <div class="salon-pie">
          <small>ENTRADA AL SALÓN</small>
          <small>Solo las mesas ocupadas tienen una cuenta para cobrar.</small>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>

  <script src="script.js"></script>
  <script>
    let mesas = [];
    let mesaSel = null;
    let vista = 'vacio';      // vacio | cuenta | cobrado

    const panel = document.getElementById('panel');
    const mapa = document.getElementById('mapa');

    /* ---------- Mapa y contadores ---------- */
    function detalleMesa(m, elegida) {
      if (elegida) return 'Seleccionada · Cuenta abierta';
      if (m.estado === 'libre') return 'Sin cuenta abierta';
      return `Cuenta abierta · ${hace(m.desde)}`;
    }

    function pintarMapa() {
      const libres = mesas.filter(m => m.estado === 'libre').length;
      document.getElementById('n-libres').textContent = libres;
      document.getElementById('n-ocupadas').textContent = mesas.length - libres;
      document.getElementById('n-mesas').textContent = `${mesas.length} mesas`;
      pintarMesas(mapa, mesas, {
        puedeElegir: m => m.estado === 'ocupada',
        detalle: detalleMesa,
        elegida: vista === 'cuenta' ? mesaSel.id : null,
        alElegir: abrirCuenta
      });
    }

    async function refrescarMesas() {
      try { mesas = await api.mesas(); pintarMapa(); } catch { /* se reintenta en el próximo ciclo */ }
    }

    /* ---------- Panel: estado inicial ---------- */
    function panelVacio() {
      vista = 'vacio'; mesaSel = null;
      panel.innerHTML = `
        <p class="sobre">Cierre de mesa</p>
        <h2>Cada cuenta, exacta.</h2>
        <p class="sub" style="margin-top:12px">Elegí una mesa roja en el mapa del salón.</p>
        <hr>
        <ol class="pasos">
          <li><b>1</b><div><strong>Seleccioná la mesa</strong><small>La que pidió la cuenta.</small></div></li>
          <li><b>2</b><div><strong>Revisá el detalle</strong><small>Cada ítem con su cantidad y subtotal.</small></div></li>
          <li><b>3</b><div><strong>Cobrá</strong><small>La mesa vuelve a estar libre.</small></div></li>
        </ol>`;
      pintarMapa();
    }

    /* ---------- Panel: cuenta de una mesa ---------- */
    async function abrirCuenta(mesa) {
      mesaSel = mesa; vista = 'cuenta';
      pintarMapa();
      let cuenta;
      try {
        cuenta = await api.cuenta(mesa.id);
      } catch (err) {
        panel.innerHTML = `
          <p class="sobre">Cuenta</p>
          <h2>Mesa ${pad(mesa.numero)}</h2>
          <p class="error">${esc(err.message)}</p>`;
        return;
      }
      const unidades = cuenta.items.reduce((t, i) => t + i.cantidad, 0);
      panel.innerHTML = `
        <p class="sobre">Cuenta</p>
        <div class="franja ocupada"><strong>Mesa ${pad(mesa.numero)}</strong><span class="chip ocupada" style="padding:0"><i class="punto"></i>Ocupada</span></div>
        <h3 style="margin-top:28px">Detalle del consumo</h3>
        <small>${plural(unidades, 'unidad', 'unidades')} · Pedido #${cuenta.pedidoId}</small>
        <ul class="items">
          ${cuenta.items.map(i => `
            <li>
              <span class="cant">${i.cantidad}</span>
              <span>${esc(i.nombre)}<small class="unit">${fmtPrecio(i.precioUnitario)} c/u</small></span>
              <span class="monto">${fmtPrecio(i.subtotal)}</span>
            </li>`).join('')}
        </ul>
        <div class="total-fila"><span>Total a cobrar</span><strong>${fmtPrecio(cuenta.total)}</strong></div>
        <p class="error" id="error" role="alert" hidden></p>
        <button class="btn" type="button" id="cobrar">Cobrar</button>
        <small class="pie-panel">Al cobrar, la mesa quedará libre.</small>`;
      document.getElementById('cobrar').addEventListener('click', () => cobrar(mesa, cuenta));
    }

    async function cobrar(mesa, cuenta) {
      const boton = document.getElementById('cobrar');
      const error = document.getElementById('error');
      error.hidden = true;
      if (!cuenta.items.length) { error.textContent = 'No se puede cobrar una mesa sin consumos.'; error.hidden = false; return; }
      boton.disabled = true;
      try {
        const resultado = await api.cobrar(cuenta.pedidoId);
        vista = 'cobrado';
        panel.innerHTML = `
          <p class="sobre ok">Cobro registrado</p>
          <h2>Mesa ${pad(resultado.mesa)} liberada.</h2>
          <div class="total-fila"><span>Total cobrado</span><strong>${fmtPrecio(resultado.total)}</strong></div>
          <div class="aviso"><strong>Lista para un nuevo cliente</strong>La mesa vuelve a figurar en verde en el salón.</div>
          <button class="btn" type="button" id="volver">Volver a las cuentas</button>`;
        document.getElementById('volver').addEventListener('click', panelVacio);
        refrescarMesas();
      } catch (err) {
        error.textContent = err.message; error.hidden = false;
        boton.disabled = false;
        refrescarMesas();
      }
    }

    /* ---------- Inicio ---------- */
    if (exigirRol('caja')) {
      montarCabecera('caja');
      refrescarMesas().then(panelVacio);
      sincronizar(refrescarMesas);
    }
  </script>
</body>
</html>
